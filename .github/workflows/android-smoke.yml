name: Check Android native integration
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Android build workflow run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: Nestune-1.0.0-Android-Tauri-unsigned
          path: unsigned
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install probe build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash clients/desktop/android/qa/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-check
          path: native-check.txt
