name: Build desktop clients

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [both, linux, macos]
        default: both
  push:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os == 'macos-15' && 'macOS universal' || 'Linux x64' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-15"]' || inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["ubuntu-22.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: clients/desktop
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            xvfb dbus-x11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
          key: ${{ matrix.os }}
          cache-on-failure: true
      - name: Install CLI
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run '${{ runner.os == 'macOS' && 'build:macos' || 'build:linux' }}'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
      - name: Verify Linux build
        if: runner.os == 'Linux'
        run: |
          file src-tauri/target/release/Nestune
          dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb
          if ldd src-tauri/target/release/Nestune | grep 'not found'; then exit 1; fi
          set +e
          dbus-run-session -- xvfb-run -a timeout 12s src-tauri/target/release/Nestune --smoke-test > linux-smoke.log 2>&1
          result=$?
          set -e
          cat linux-smoke.log
          test "$result" -eq 124
      - name: Verify macOS build
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Nestune.app
          lipo "$app/Contents/MacOS/Nestune" -verify_arch x86_64 arm64
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist"
          hdiutil verify src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Collect packages
        run: |
          mkdir -p packages
          if [[ '${{ runner.os }}' == 'Linux' ]]; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage packages/Nestune-1.0.0-Linux-x64.AppImage
            cp src-tauri/target/release/bundle/deb/*.deb packages/Nestune-1.0.0-Linux-amd64.deb
            (cd packages && sha256sum * > SHA256SUMS.txt)
          else
            bundle=src-tauri/target/universal-apple-darwin/release/bundle
            cp "$bundle"/dmg/*.dmg packages/Nestune-1.0.0-macOS-universal.dmg
            ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Nestune.app" packages/Nestune-1.0.0-macOS-universal.app.zip
            (cd packages && shasum -a 256 * > SHA256SUMS.txt)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os == 'macOS' && 'Nestune-1.0.0-macOS-universal' || 'Nestune-1.0.0-Linux-x64' }}
          path: clients/desktop/packages/
          if-no-files-found: error
          retention-days: 30
