name: Build desktop clients

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [both, linux, linux-arm64, macos, windows-arm64]
        default: both
  push:
    branches: [main, 'release/**']
    paths:
      - 'clients/desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.platform != 'windows-arm64'
    name: ${{ matrix.os == 'macos-15' && 'macOS universal' || matrix.os == 'ubuntu-22.04-arm' && 'Linux ARM64' || 'Linux x64' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-15"]' || inputs.platform == 'linux-arm64' && '["ubuntu-22.04-arm"]' || inputs.platform == 'linux' && '["ubuntu-22.04","ubuntu-22.04-arm"]' || '["ubuntu-22.04","ubuntu-22.04-arm","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: clients/desktop
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            xvfb dbus-x11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
          key: ${{ matrix.os }}
          cache-on-failure: true
      - name: Install CLI
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run '${{ runner.os == 'macOS' && 'build:macos' || 'build:linux' }}'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
      - name: Verify Linux build
        if: runner.os == 'Linux'
        run: |
          expected=${{ matrix.os == 'ubuntu-22.04-arm' && 'aarch64' || 'x86_64' }}
          test "$(uname -m)" = "$expected"
          file src-tauri/target/release/Nestune
          test "$(dpkg-deb --field src-tauri/target/release/bundle/deb/*.deb Architecture)" = '${{ matrix.os == 'ubuntu-22.04-arm' && 'arm64' || 'amd64' }}'
          dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb
          if ldd src-tauri/target/release/Nestune | grep 'not found'; then exit 1; fi
          set +e
          dbus-run-session -- xvfb-run -a timeout 12s src-tauri/target/release/Nestune --smoke-test > linux-smoke.log 2>&1
          result=$?
          set -e
          cat linux-smoke.log
          test "$result" -eq 124
          set +e
          dbus-run-session -- xvfb-run -a timeout 15s src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract-and-run --smoke-test > appimage-smoke.log 2>&1
          result=$?
          set -e
          cat appimage-smoke.log
          test "$result" -eq 124
      - name: Verify macOS build
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Nestune.app
          lipo "$app/Contents/MacOS/Nestune" -verify_arch x86_64 arm64
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist"
          hdiutil verify src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Check native tray lifecycle
        run: |
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          if [[ '${{ runner.os }}' == 'Linux' ]]; then
            dbus-run-session -- xvfb-run -a timeout 30s src-tauri/target/debug/nestune --tray-qa
          else
            python3 -c 'import subprocess; subprocess.run(["src-tauri/target/debug/nestune", "--tray-qa"], check=True, timeout=30)'
          fi
      - name: Collect packages
        id: packages
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p packages
          if [[ '${{ runner.os }}' == 'Linux' ]]; then
            arch=${{ matrix.os == 'ubuntu-22.04-arm' && 'arm64' || 'x64' }}
            debarch=${{ matrix.os == 'ubuntu-22.04-arm' && 'arm64' || 'amd64' }}
            echo "artifact_suffix=Linux-$arch" >> "$GITHUB_OUTPUT"
            cp src-tauri/target/release/bundle/appimage/*.AppImage "packages/Nestune-$version-Linux-$arch.AppImage"
            cp src-tauri/target/release/bundle/deb/*.deb "packages/Nestune-$version-Linux-$debarch.deb"
            (cd packages && sha256sum * > SHA256SUMS.txt)
          else
            echo 'artifact_suffix=macOS-universal' >> "$GITHUB_OUTPUT"
            bundle=src-tauri/target/universal-apple-darwin/release/bundle
            cp "$bundle"/dmg/*.dmg "packages/Nestune-$version-macOS-universal.dmg"
            ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Nestune.app" "packages/Nestune-$version-macOS-universal.app.zip"
            (cd packages && shasum -a 256 * > SHA256SUMS.txt)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Nestune-${{ steps.packages.outputs.version }}-${{ steps.packages.outputs.artifact_suffix }}
          path: clients/desktop/packages/
          if-no-files-found: error
          retention-days: 30

  windows-arm64:
    name: Windows ARM64
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows-arm64'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
          key: windows-arm64
      - name: Build and verify ARM64 installer and executable
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (!$vs) { throw 'MSVC ARM64 build tools are missing' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=x64'
          ./clients/build-tauri-windows.ps1 -Architecture arm64
          $version = (Get-Content -Raw clients/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "NESTUNE_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Nestune-${{ env.NESTUNE_BUILD_VERSION }}-Windows-arm64
          path: releases/${{ env.NESTUNE_BUILD_VERSION }}-tauri/
          if-no-files-found: error
          retention-days: 30
