# Installed on the NAS as /vol1/opt/docker/nestune/compose.yaml
name: nestune
services:
  audio-worker:
    image: nestune-audio-worker:0.1.0
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_IP:-0.0.0.0}:4191:4191"
    environment:
      WORKER_KEY: "${WORKER_KEY:?Set WORKER_KEY in .env}"
    volumes:
      - ./storage/incoming:/input:ro
      - ./storage/music:/output
      - ./audio-worker/state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
networks:
  default:
    name: nestune_default
