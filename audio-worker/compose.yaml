name: nestune-audio-dev
services:
  audio-worker:
    image: nestune-audio-worker:0.1.0
    build: .
    init: true
    restart: unless-stopped
    environment:
      WORKER_KEY: "${WORKER_KEY:?Set WORKER_KEY in .env}"
    volumes:
      - ./storage/incoming:/input:ro
      - ./storage/music:/output
      - ./state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
