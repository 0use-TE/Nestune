<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src ipc: http://ipc.localhost; img-src 'none'">
<title>Nestune · 桌面歌词</title>
<style>
*{box-sizing:border-box}html,body{background:transparent;margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif;user-select:none}body{padding:6px}main{height:100%;border-radius:18px;padding:34px 16px 10px;display:flex;flex-direction:column;justify-content:center;position:relative;cursor:grab;background:rgba(0,0,0,.012)}main:active{cursor:grabbing}body.panel main{background:#181817e6;border:1px solid #ffffff1c;box-shadow:0 3px 15px #0002}#line{font-size:clamp(19px,4.8vw,30px);line-height:1.35;font-weight:650;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000c}#translation{font-size:16px;text-align:center;line-height:1.4;color:#f4f3ef;text-shadow:0 1px 3px #000,0 0 5px #000;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#title{font-size:10px;color:#e8e7e1;text-shadow:0 1px 3px #000;margin-top:7px;text-align:center;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}nav{z-index:2;position:absolute;right:12px;top:5px;display:flex;gap:4px;opacity:0;transition:opacity .15s}main:hover nav,nav:focus-within{opacity:1}button{display:grid;place-items:center;width:27px;height:27px;border:1px solid #ffffff20;border-radius:8px;background:#181817ed;color:#eee;cursor:pointer}button:hover,button:focus-visible{background:#41413e;outline:1px solid #fff6}svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#status{position:absolute;inset:auto 12px 2px;font-size:10px;text-align:center;color:#fff;text-shadow:0 1px 3px #000}body.locked main{cursor:default}body.locked nav{opacity:1}
.k-word{display:inline-block;position:relative;white-space:pre}.k-ink{position:absolute;inset:0;color:transparent;background-image:linear-gradient(100deg,#73acf0,#9bbded 22%,#edd083 46%,#f1d78e 54%,#9bbded 78%,#73acf0);background-size:var(--lyric-width,600px) 100%;background-position:calc(var(--lyric-flow,0px) - var(--word-x,0px)) 50%;background-clip:text;-webkit-background-clip:text;clip-path:inset(0 calc(100% - var(--sung,0%)) 0 0);text-shadow:none}
#line,#translation,#title,#status{pointer-events:none}
#line-content,#translation-content{display:inline-block;min-width:100%;white-space:nowrap;will-change:transform}#line,#translation{text-overflow:clip}
body.locked:not(.tools) nav{visibility:hidden}body.tools #line,body.tools #translation,body.tools #title,body.tools #status{display:none}body.tools main{padding:0;background:transparent!important;border:0!important;box-shadow:none!important}body.tools nav{opacity:1}button[aria-pressed="true"]{color:#edd083;border-color:#edd08388}button:disabled{opacity:.65}
body nav,body main:hover nav,body.locked nav,body.tools nav{opacity:1}
body[data-idle] nav:not(:has(:focus-visible)),body[data-idle] main:hover nav:not(:has(:focus-visible)){opacity:.22}
.mode-state{position:relative}.mode-state span{position:absolute;font-size:8px;font-weight:bold;pointer-events:none}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
</style></head><body><main id="drag"><nav>
<button id="mode" class="mode-state" data-control="mode" title="不循环" aria-label="切换播放模式，当前不循环"><svg viewBox="0 0 24 24"><path d="M18 3l3 3-3 3M3 11V9a3 3 0 0 1 3-3h15M6 21l-3-3 3-3m15-2v2a3 3 0 0 1-3 3H3M4 3l16 18"/></svg><span hidden>1</span></button>
<button data-control="previous" title="上一首" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M6 5v14m13-14L8 12l11 7Z"/></svg></button>
<button id="toggle" data-control="toggle" title="播放" aria-label="播放"><svg viewBox="0 0 24 24"><path d="m8 5 12 7-12 7Z"/></svg></button>
<button data-control="next" title="下一首" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l11 7-11 7Z"/></svg></button>
<button id="panel" title="切换歌词背景" aria-label="切换歌词背景"><svg viewBox="0 0 24 24"><path d="M12 3C8 8 6 11 6 15a6 6 0 0 0 12 0c0-4-2-7-6-12Z"/></svg></button>
<button id="lock" title="锁定歌词位置" aria-label="锁定歌词位置" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg></button>
<button id="close" title="关闭桌面歌词" aria-label="关闭桌面歌词"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</nav><div id="line"><span id="line-content">暂无播放</span></div><div id="translation" hidden><span id="translation-content"></span></div><div id="title">Nestune</div><div id="status" role="status"></div></main>
<script src="karaoke.js"></script>
<script>
if(new URLSearchParams(location.search).has('tools'))document.body.classList.add('tools');
let data=null,media={id:'',position:0,playing:false,at:performance.now()},state={panel:false,locked:false};
const line=document.getElementById('line'),translation=document.getElementById('translation'),title=document.getElementById('title');
const content=document.getElementById('line-content'),translated=document.getElementById('translation-content');
const karaoke=window.NestuneKaraoke.create(content);
function scrollLyrics(element,viewport,progress){const overflow=Math.max(0,element.scrollWidth-viewport.clientWidth);element.style.transform=`translateX(${-overflow*Math.max(0,Math.min(1,(progress-.12)/.76))}px)`}
const request=data=>window.__TAURI_INTERNALS__.invoke('lyrics_command',{data});
function display(){const position=media.position+(media.playing?(performance.now()-media.at)/1000:0);let current,end=0;
 if(data&&data.id===media.id){const lines=data.lines||[];let low=0,high=lines.length;while(low<high){const middle=(low+high)>>>1;if(lines[middle].t<=position)low=middle+1;else high=middle}current=lines[low-1];end=lines[low]?.t||data.duration||((current?.t||0)+5);if(current)karaoke.render(current,lines[low]?.t,data.duration,data.flowSeed,position);else karaoke.clear(lines.length?'前奏':data.plainText?.split('\n').find(Boolean)||'暂无歌词');title.textContent=data.title||'Nestune'}
 else{karaoke.clear(media.id?'正在加载歌词':'暂无播放');title.textContent='Nestune'}translated.textContent=current?.tr||'';translation.hidden=!translated.textContent;const progress=current?(position-current.t)/Math.max(.2,(current.d>0?current.d:end-current.t)):0;scrollLyrics(content,line,progress);scrollLyrics(translated,translation,progress);}
const modePaths = {
  off: 'M18 3l3 3-3 3M3 11V9a3 3 0 0 1 3-3h15M6 21l-3-3 3-3m15-2v2a3 3 0 0 1-3 3H3M4 3l16 18',
  all: 'M18 3l3 3-3 3M3 11V9a3 3 0 0 1 3-3h15M6 21l-3-3 3-3m15-2v2a3 3 0 0 1-3 3H3',
  shuffle: 'M3 6h3c4 0 6 12 10 12h5m-3-3 3 3-3 3M3 18h3c4 0 6-12 10-12h5m-3-3 3 3-3 3'
};
const modeNames = { off: '不循环', all: '列表循环', one: '单曲循环', shuffle: '随机播放' };
const modeButton = document.getElementById('mode');
const toggleButton = document.getElementById('toggle');
function updateControls() {
  const mode = Object.hasOwn(modeNames, media.mode) ? media.mode : 'off';
  modeButton.title = modeNames[mode];
  modeButton.setAttribute('aria-label', '切换播放模式，当前' + modeButton.title);
  modeButton.setAttribute('aria-pressed', String(mode !== 'off'));
  modeButton.querySelector('path').setAttribute('d', modePaths[mode === 'one' ? 'all' : mode]);
  modeButton.querySelector('span').hidden = mode !== 'one';
  toggleButton.title = media.playing ? '暂停' : '播放';
  toggleButton.setAttribute('aria-label', toggleButton.title);
  toggleButton.querySelector('path').setAttribute('d', media.playing ? 'M9 5v14m6-14v14' : 'm8 5 12 7-12 7Z');
}
window.nestuneLyricsData = value => { data = value; display(); };
window.nestuneLyricsMedia = value => {
  if (!value) return;
  const changed = value.mode !== media.mode || value.playing !== media.playing;
  media = { ...value, at: performance.now() };
  if (changed) updateControls();
  display();
};
function preference(value){state=value;document.body.classList.toggle('panel',!!state.panel);document.body.classList.toggle('locked',!!state.locked);const button=document.getElementById('lock');button.title=state.locked?'解锁歌词位置':'锁定歌词位置';button.setAttribute('aria-label',button.title);button.setAttribute('aria-pressed',String(!!state.locked));button.querySelector('svg').innerHTML=state.locked?'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>':'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 7.5-2M12 14v3"/>'}
window.nestuneLyricsState=preference;
function error(){document.getElementById('status').textContent='操作失败，请从播放器重新打开歌词'}

let idleTimer;
function wake() {
  delete document.body.dataset.idle;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { document.body.dataset.idle = ''; }, 3000);
}
for (const event of ['pointerenter', 'pointermove', 'pointerdown', 'focusin']) {
  document.getElementById('drag').addEventListener(event, wake);
}
for (const button of document.querySelectorAll('[data-control]')) {
  button.onclick = () => request({ type: 'lyricsPlayback', action: button.dataset.control }).catch(error);
}
wake();
document.getElementById('drag').addEventListener('mousedown',event=>{if(!state.locked&&event.button===0&&!event.target.closest('button'))request({type:'lyricsDrag'}).catch(error)});
document.getElementById('panel').onclick=()=>request({type:'lyricsPanel',panel:!state.panel}).then(preference).catch(error);
document.getElementById('lock').onclick=async()=>{const button=document.getElementById('lock');if(button.disabled)return;button.disabled=true;try{preference(await request({type:'lyricsLock',locked:!state.locked}))}catch{error()}finally{button.disabled=false}};
document.getElementById('close').onclick=()=>request({type:'lyricsEnable',enabled:false}).catch(error);
request({type:'lyricsSnapshot'}).then(value=>{preference(value.state);window.nestuneLyricsData(value.data);window.nestuneLyricsMedia(value.media)}).catch(error);
setInterval(display,33);
</script></body></html>
