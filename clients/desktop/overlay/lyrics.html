<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src ipc: http://ipc.localhost; img-src 'none'">
<title>Nestune · 桌面歌词</title>
<style>
*{box-sizing:border-box}html,body{background:transparent;margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif;user-select:none}body{padding:6px}main{height:100%;border-radius:18px;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;position:relative;cursor:grab;background:rgba(0,0,0,.012)}main:active{cursor:grabbing}body.panel main{background:#181817e6;border:1px solid #ffffff1c;box-shadow:0 3px 15px #0002}#line{font-size:clamp(19px,4.8vw,30px);line-height:1.35;font-weight:650;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000c}#translation{font-size:16px;text-align:center;line-height:1.4;color:#f4f3ef;text-shadow:0 1px 3px #000,0 0 5px #000;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#title{font-size:10px;color:#e8e7e1;text-shadow:0 1px 3px #000;margin-top:7px;text-align:center;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}nav{position:absolute;right:12px;top:5px;display:flex;gap:4px;opacity:0;transition:opacity .15s}main:hover nav,nav:focus-within{opacity:1}button{display:grid;place-items:center;width:27px;height:27px;border:1px solid #ffffff20;border-radius:8px;background:#181817ed;color:#eee;cursor:pointer}button:hover,button:focus-visible{background:#41413e;outline:1px solid #fff6}svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#status{position:absolute;inset:auto 12px 2px;font-size:10px;text-align:center;color:#fff;text-shadow:0 1px 3px #000}body.locked main{cursor:default}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
</style></head><body><main id="drag" data-tauri-drag-region><nav>
<button id="panel" title="切换歌词背景" aria-label="切换歌词背景"><svg viewBox="0 0 24 24"><path d="M12 3C8 8 6 11 6 15a6 6 0 0 0 12 0c0-4-2-7-6-12Z"/></svg></button>
<button id="lock" title="锁定并穿透鼠标，可在播放器设置中解锁" aria-label="锁定歌词"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg></button>
<button id="close" title="关闭桌面歌词" aria-label="关闭桌面歌词"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</nav><div id="line" data-tauri-drag-region>暂无播放</div><div id="translation" data-tauri-drag-region hidden></div><div id="title" data-tauri-drag-region>Nestune</div><div id="status" role="status"></div></main>
<script>
let data=null,media={id:'',position:0,playing:false,at:performance.now()},state={panel:false,locked:false};
const line=document.getElementById('line'),translation=document.getElementById('translation'),title=document.getElementById('title');
const request=data=>window.__TAURI_INTERNALS__.invoke('lyrics_command',{data});
function display(){const position=media.position+(media.playing?(performance.now()-media.at)/1000:0);let current;
 if(data&&data.id===media.id){const lines=data.lines||[];let low=0,high=lines.length;while(low<high){const middle=(low+high)>>>1;if(lines[middle].t<=position)low=middle+1;else high=middle}current=lines[low-1];line.textContent=current?.text||(lines.length?'前奏':data.plainText?.split('\n').find(Boolean)||'暂无歌词');title.textContent=data.title||'Nestune'}
 else{line.textContent=media.id?'正在加载歌词':'暂无播放';title.textContent='Nestune'}translation.textContent=current?.tr||'';translation.hidden=!translation.textContent;}
window.nestuneLyricsData=value=>{data=value;display()};window.nestuneLyricsMedia=value=>{if(!value)return;media={...value,at:performance.now()};display()};
function preference(value){state=value;document.body.classList.toggle('panel',!!state.panel);document.body.classList.toggle('locked',!!state.locked)}
window.nestuneLyricsState=preference;
function error(){document.getElementById('status').textContent='操作失败，请从播放器重新打开歌词'}

document.getElementById('drag').addEventListener('mousedown',event=>{if(event.button===0&&!event.target.closest('button'))window.__TAURI_INTERNALS__.invoke('plugin:window|start_dragging',{label:'lyrics'}).catch(error)});
document.getElementById('panel').onclick=()=>request({type:'lyricsPanel',panel:!state.panel}).then(preference).catch(error);
document.getElementById('lock').onclick=()=>request({type:'lyricsLock',locked:true}).then(preference).catch(error);
document.getElementById('close').onclick=()=>request({type:'lyricsEnable',enabled:false}).catch(error);
request({type:'lyricsSnapshot'}).then(value=>{preference(value.state);window.nestuneLyricsData(value.data);window.nestuneLyricsMedia(value.media)}).catch(error);
setInterval(display,100);
</script></body></html>
