[package]
name = "nestune"
version = "1.2.9"
description = "Nestune music player"
authors = ["Nestune"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "nestune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"
open = "5"

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.13.5", features = ["blocking"], default-features = true }
sha2 = "0.10.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
