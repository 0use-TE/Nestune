[package]
name = "nestune"
version = "1.0.0"
description = "Nestune music player"
authors = ["Nestune"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "nestune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
