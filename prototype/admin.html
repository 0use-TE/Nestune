<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nestune 管理后台</title>
<style>
:root{--bg:#f6f6f4;--surface:#fff;--soft:#f0efec;--text:#161615;--sub:#6d6c66;--muted:#a3a29b;--line:#e8e7e2;--accent:#161615;--on-accent:#fff;--danger:#d2402b;--ok:#2a7a3a;--okbg:#e3f3e6;--warn:#9a6a10;--warnbg:#fdf0d8}
:root[data-theme=dark]{--bg:#0e0e0d;--surface:#171716;--soft:#222221;--text:#f3f2ee;--sub:#a09f98;--muted:#6b6a64;--line:#272725;--accent:#f3f2ee;--on-accent:#0e0e0d;--danger:#f0705c;--ok:#8ad69a;--okbg:#1e3a25;--warn:#e8bf70;--warnbg:#3d3118}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0d;--surface:#171716;--soft:#222221;--text:#f3f2ee;--sub:#a09f98;--muted:#6b6a64;--line:#272725;--accent:#f3f2ee;--on-accent:#0e0e0d;--danger:#f0705c;--ok:#8ad69a;--okbg:#1e3a25;--warn:#e8bf70;--warnbg:#3d3118}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Inter",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select{font:inherit;color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em}h2{font-size:16px;font-weight:600}
.sub{color:var(--sub)}.muted{color:var(--muted)}.sm{font-size:12px}
.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 4px;font-weight:800;font-size:16px;letter-spacing:-.02em}
.logo{width:24px;height:24px;border-radius:7px;background:var(--text);position:relative;overflow:hidden}.logo::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--surface);right:-3px;bottom:-3px}
.badge{margin:0 10px 22px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--sub)}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--sub);text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--soft);color:var(--text)}.nav.on{background:var(--soft);color:var(--text);font-weight:600}
.sp{flex:1}
main{padding:36px 44px 60px;max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px}
.btn:hover{opacity:.88}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{color:var(--danger)}.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.stat b{font-size:28px;font-weight:700;display:block;letter-spacing:-.02em;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.panel.pad{padding:22px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:14px 18px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.wait{background:var(--warnbg);color:var(--warn)}
.set{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:20px}.set:last-child{border:0}
.switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
.qr{width:140px;height:140px;border-radius:12px;background:repeating-conic-gradient(var(--text) 0 25%,transparent 0 50%) 0 0/18px 18px;opacity:.85;flex:none}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.note{background:var(--soft);border-radius:10px;padding:12px 16px;color:var(--sub);font-size:13px;margin-bottom:18px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:30;padding:20px}
.modal{background:var(--surface);border-radius:18px;padding:26px;width:min(440px,100%);box-shadow:0 30px 80px rgba(0,0,0,.3)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field input,.field select{background:var(--soft);border:1.5px solid transparent;border-radius:10px;padding:11px 13px;outline:0}.field input:focus{border-color:var(--text)}
.code{font:700 26px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;text-align:center;background:var(--soft);padding:20px;border-radius:12px;margin:16px 0;user-select:all}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:10px 20px;border-radius:999px;z-index:60;font-size:13px;font-weight:600}
#login{position:fixed;inset:0;background:var(--bg);z-index:40;display:grid;place-items:center;padding:20px}
.lbox{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px}
.lbox .btn{width:100%;justify-content:center;padding:12px;margin-top:6px}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;align-items:center}.badge,.sp,.brand+.badge{display:none}.brand{padding:0 8px}.nav{width:auto;white-space:nowrap}main{padding:22px 16px}.hm{display:none}}
</style>
</head>
<body>
<div class="shell"><aside id="side"></aside><main id="main"></main></div>
<div id="layer"></div><div id="login"></div>
<script>
const P={dash:'<rect x="3" y="3" width="7" height="9" rx="1.500"/><rect x="14" y="3" width="7" height="5" rx="1.500"/><rect x="14" y="12" width="7" height="9" rx="1.500"/><rect x="3" y="16" width="7" height="5" rx="1.500"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.870M16 3.130a4 4 0 0 1 0 7.750"/>',
cloud:'<path d="M17.500 19a4.500 4.500 0 1 0-1-8.900A6 6 0 0 0 4.500 12 3.500 3.500 0 0 0 6 19z"/>',
disk:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.700 4 3 9 3s9-1.300 9-3V5M3 12c0 1.700 4 3 9 3s9-1.300 9-3"/>',
task:'<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
sys:'<circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.100a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'};
const I=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const $=s=>document.querySelector(s);
const st={tab:'dash',login:true,qr:'已登录'};
const TABS=[['dash','概览','dash'],['users','用户','users'],['netease','网易云账号','cloud'],['cache','缓存','disk'],['jobs','转换任务','task'],['system','系统与更新','sys']];
const USERS=[['ouse','管理员','正常','刚刚','可保存','无损'],['xiaoli','用户','正常','2 小时前','可保存','极高'],['mom','用户','待激活','—','仅播放','极高'],['guest','用户','已禁用','3 天前','仅播放','标准']];
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),1800)}
function modal(h){$('#layer').innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">${h}</div></div>`}
const closeModal=()=>$('#layer').innerHTML='';
function shell(){$('#side').innerHTML=`<div class="brand"><span class="logo"></span>Nestune</div><div class="badge">管理后台</div>`+TABS.map(t=>`<button class="nav ${st.tab===t[0]?'on':''}" onclick="st.tab='${t[0]}';shell();view()">${I(t[2])}${t[1]}</button>`).join('')+`<div class="sp"></div><button class="nav" onclick="st.login=true;login()">${I('out')}退出后台</button>`}
const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
const V={
dash:()=>`<div class="head"><div><h1>概览</h1><div class="sub">服务运行正常</div></div></div>
 <div class="stats"><div class="stat"><span class="sub sm">用户</span><b>4</b></div><div class="stat"><span class="sub sm">当前在线</span><b>2</b></div><div class="stat"><span class="sub sm">今日播放</span><b>137</b></div><div class="stat"><span class="sub sm">缓存命中率</span><b>78%</b></div></div>
 <div class="panel"><table><tr><th>需要关注</th><th></th></tr><tr><td>用户 mom 的激活码尚未使用</td><td style="text-align:right">${pill('待处理','wait')}</td></tr><tr><td>转换任务 1 个失败</td><td style="text-align:right">${pill('待处理','wait')}</td></tr><tr><td>网易云会话状态</td><td style="text-align:right">${pill('正常','ok')}</td></tr></table></div>`,
users:()=>`<div class="head"><div><h1>用户</h1><div class="sub">共 ${USERS.length} 个用户。新用户首次登录必须自己设置密码。</div></div><button class="btn" onclick="newUser()">${I('plus')}创建用户</button></div>
 <div class="panel"><table><tr><th>用户</th><th>角色</th><th>状态</th><th class="hm">最近活跃</th><th class="hm">NAS 保存</th><th class="hm">最高音质</th><th></th></tr>${USERS.map(u=>`<tr><td><b>${u[0]}</b></td><td>${u[1]}</td><td>${pill(u[2],u[2]==='正常'?'ok':u[2]==='待激活'?'wait':'')}</td><td class="hm sub">${u[3]}</td><td class="hm sub">${u[4]}</td><td class="hm sub">${u[5]}</td>
 <td style="text-align:right"><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" onclick="showCode('${u[0]}',1)">重置密码</button><button class="btn ghost sm" onclick="toast('已强制下线')">下线</button></div></td></tr>`).join('')}</table></div>`,
netease:()=>`<div class="head"><div><h1>网易云账号</h1><div class="sub">所有用户共用此账号的权限</div></div></div>
 <div class="panel pad row" style="gap:28px;align-items:flex-start"><div class="qr"></div><div style="flex:1;min-width:220px"><h2>音源会话</h2><p class="sub" style="margin:6px 0 16px">状态：${pill(st.qr,'ok')}<br>会话只保存在服务端，不会返回给任何用户。</p><div class="row"><button class="btn sm" onclick="toast('请用网易云 App 扫码')">重新扫码登录</button><button class="btn ghost sm danger" onclick="st.qr='未登录';view()">退出登录</button></div></div></div>
 <div class="note">可播放的音质取决于该账号实际拥有的权限。共享账号可能违反网易云服务条款，请自行评估风险。</div>
 <div class="panel"><div class="set"><div><b>单用户每分钟请求上限</b><div class="sub sm">防止短时间大量请求影响账号</div></div><select style="background:var(--soft);border:0;border-radius:8px;padding:8px 12px"><option>60</option><option>120</option><option>30</option></select></div><div class="set"><div><b>同时流播放数</b><div class="sub sm">每个用户同时播放的歌曲数</div></div><select style="background:var(--soft);border:0;border-radius:8px;padding:8px 12px"><option>2</option><option>1</option><option>3</option></select></div></div>`,
cache:()=>`<div class="head"><div><h1>缓存</h1><div class="sub">已播放的歌曲会缓存到 NAS，再次播放不再请求网易云</div></div><button class="btn ghost danger" onclick="toast('缓存已清空')">清空缓存</button></div>
 <div class="stats"><div class="stat"><span class="sub sm">已用空间</span><b>12.4 GB</b><div class="bar"><i style="width:25%"></i></div></div><div class="stat"><span class="sub sm">上限</span><b>50 GB</b></div><div class="stat"><span class="sub sm">缓存歌曲</span><b>1,284</b></div><div class="stat"><span class="sub sm">命中率</span><b>78%</b></div></div>
 <div class="panel"><div class="set"><div><b>超过上限时自动清理</b><div class="sub sm">按最久未播放的顺序清理，不影响 NAS 本地库</div></div><button class="switch on" onclick="this.classList.toggle('on')"></button></div></div>`,
jobs:()=>`<div class="head"><div><h1>转换任务</h1><div class="sub">NCM 解密与 MP3 转码，由 audio-worker 处理</div></div></div>
 <div class="panel"><table><tr><th>文件</th><th>格式</th><th>状态</th><th></th></tr>${[['夜航星.ncm','MP3 320','完成','ok'],['晴天.ncm','FLAC','处理中','wait'],['稻香.ncm','MP3 320','排队','wait'],['南山南.ncm','MP3 320','失败','']].map(r=>`<tr><td>${r[0]}</td><td class="sub">${r[1]}</td><td>${pill(r[2],r[3])}</td><td style="text-align:right">${r[2]==='失败'?'<button class="btn ghost sm" onclick="toast(\'已重新入队\')">重试</button>':''}</td></tr>`).join('')}</table></div>`,
system:()=>`<div class="head"><div><h1>系统与更新</h1></div></div>
 <div class="stats"><div class="stat"><span class="sub sm">当前版本</span><b>0.1.0</b></div><div class="stat"><span class="sub sm">运行时间</span><b>6 天</b></div><div class="stat"><span class="sub sm">在线客户端</span><b>2</b></div></div>
 <div class="panel"><div class="set"><div><b>通知客户端更新</b><div class="sub sm">在线的客户端会提示“点击更新”，不会打断正在播放的歌曲</div></div><button class="btn sm" onclick="toast('已通知在线客户端')">发布更新提示</button></div><div class="set"><div><b>强制更新</b><div class="sub sm">用于紧急修复，客户端会立即刷新并中断播放</div></div><button class="btn ghost sm danger" onclick="toast('已强制更新')">强制刷新</button></div></div>
 <div class="panel"><div class="set"><div><b>外观</b></div><div class="row"><button class="btn ghost sm" onclick="setT('auto')">自动</button><button class="btn ghost sm" onclick="setT('light')">浅色</button><button class="btn ghost sm" onclick="setT('dark')">深色</button></div></div></div>`};
function setT(t){t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=t}
function view(){$('#main').innerHTML=V[st.tab]()}
function newUser(){modal(`<h2>创建用户</h2><p class="sub" style="margin:4px 0 18px">创建后生成一次性激活码，对方首次登录时自己设置密码，你不会知道对方的密码。</p>
 <div class="field"><label class="sm sub">用户名</label><input id="nu" placeholder="例如 xiaoli"></div>
 <div class="field"><label class="sm sub">角色</label><select><option>用户</option><option>管理员</option></select></div>
 <div class="field"><label class="sm sub">最高音质</label><select><option>标准</option><option selected>极高</option><option>无损</option></select></div>
 <div class="set" style="padding:12px 0"><b>允许保存到 NAS</b><button class="switch on" onclick="this.classList.toggle('on')"></button></div>
 <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="showCode(document.getElementById('nu').value||'newuser')">创建并生成激活码</button></div>`)}
function showCode(u,r){modal(`<h2>${r?'已重置':'已创建'}：${u}</h2><p class="sub" style="margin-top:4px">把激活码发给对方，48 小时内有效，只显示这一次。</p><div class="code">K7QM-92XD-RT4F</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="toast('已复制')">${I('copy')}复制</button><button class="btn" onclick="closeModal()">完成</button></div>`)}
function login(){const e=$('#login');if(!st.login){e.style.display='none';return}e.style.display='grid';
 e.innerHTML=`<div class="lbox"><div class="brand" style="padding:0"><span class="logo"></span>Nestune</div><div class="sub sm" style="margin:6px 0 24px;letter-spacing:.06em;font-weight:600">管理后台</div>
 <form onsubmit="event.preventDefault();st.login=false;login()"><div class="field"><label class="sm sub">管理员账号</label><input value="ouse"></div><div class="field"><label class="sm sub">密码</label><input type="password" value="password"></div><button class="btn" type="submit">登录后台</button></form></div>`}
shell();view();login();if(location.hash==='#nologin'){st.login=false;login()}
</script>
</body>
</html>
