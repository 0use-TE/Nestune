name: nestune-web
services:
  web:
    build: .
    image: nestune-web:0.1.0
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      ADMIN_KEY: "${ADMIN_KEY:?Set ADMIN_KEY in .env}"
      WORKER_URL: http://audio-worker:4191
      WORKER_KEY: "${WORKER_KEY:?Set WORKER_KEY in .env}"
      BUILD_ID: nas
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
networks:
  default:
    external: true
    name: nestune_default
