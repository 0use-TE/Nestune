<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0e">
  <title>暂时无法连接 · Nestune</title>
  <style>
    :root{color-scheme:light dark;--bg:#fbfaf8;--text:#141413;--sub:#6d6c66;--surface:#fff;--line:#ebe9e4}
    @media(prefers-color-scheme:dark){:root{--bg:#0f0f0e;--text:#f4f3ef;--sub:#a09f98;--surface:#181817;--line:#262624}}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    main{width:min(100%,380px);text-align:center;padding:36px 24px;border:1px solid var(--line);border-radius:28px;background:var(--surface)}
    img{width:68px;height:68px}h1{font-size:25px;letter-spacing:-.03em;margin:24px 0 10px}p{color:var(--sub);margin:0 0 28px}
    button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 28px;background:var(--text);color:var(--bg);cursor:pointer}
    button:active{opacity:.72}button:focus-visible{outline:2px solid var(--text);outline-offset:4px}
  </style>
</head>
<body><main>
  <img src="/pwa/icon-192.png" alt="Nestune">
  <h1>暂时无法连接</h1>
  <p>请检查网络连接，或稍后再回来听歌。</p>
  <button type="button" onclick="location.reload()">重新连接</button>
</main></body>
</html>
